   <template>
	<div class="slds-grid slds-wrap header-shadow headerStyle">
	   <div class="slds-col slds-size_1-of-1 slds-medium-size_6-of-12 slds-large-size_6-of-12 slds-p-around_small">
		  <h1 class="title">{CUSTOM_LABELS.Profile_User_Configuration}</h1>
		  <p>{CUSTOM_LABELS.Profile_User_Configuration_help_text}</p>
	   </div>
	   <div class="slds-col slds-size_1-of-1 slds-medium-size_6-of-12 slds-large-size_6-of-12 slds-p-around_small">
		  <div class="iconflex" if:false={bolShowPermissionForm}>
			 <div class="slds-text-align_center cursorp" if:true={bolShowMassDelete}>
				<button class="slds-button slds-button_icon btnicn selDelete" title="Delete" 
				   onclick={handleConfirmDelete} data-name="massdelete">

					  <path
						 id="Union_80"
						 data-name="Union 80"

						 />
				   </svg>
				   {CUSTOM_LABELS.Delete}
				</button>
			 </div>
		  </div>
		  <div class="iconflex" if:false={bolShowPermissionForm}>
			 <div class="slds-text-align_center cursorp">
				<button class="slds-button slds-button_neutral addpermission-button" onclick={handleSwitchScreen}>
				   <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 12 12">
					  <g clip-path="url(#a)">
						 <path stroke="#fff" stroke-linecap="round" stroke-width=".75"

					  </g>

						 <clipPath id="a">
							<path fill="#fff" d="M0 0h12v12H0z" />
						 </clipPath>
					  </defs>
				   </svg>
				   {CUSTOM_LABELS.Add_Permission}
				</button>
			 </div>
		  </div>
		  <div class="iconflex" if:true={bolShowPermissionForm}>
			 <div class="slds-text-align_center cursorp">
				<button class="slds-button slds-button_icon btnicn btnicn2 prel" title="Back To Home"
				   onclick={handleSwitchScreen}>
				   <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 12 12">
					  <g clip-path="url(#a)">
						 <path fill="#4d4d4d"
							d="m6.463 3.75-2.32 1.93a.417.417 0 0 0 0 .64l2.32 1.93a.417.417 0 0 0 .683-.32V4.07a.417.417 0 0 0-.683-.32Z" />

					  </g>
				   </svg>
				   {CUSTOM_LABELS.Back_To_Home}
				</button>
			 </div>
		  </div>
	   </div>
	</div>
	<div class="transbg slds-m-around_small">
	   <div if:true={bolShowPermissionForm} data-id="parentDiv" onclick={handleSearch}>
		  <lightning-layout multiple-rows>
			 <lightning-layout-item size="12" small-device-size="12" medium-device-size="6" large-device-size="6" padding="around-small">
				<div>
				   <h2 class="innerTitle helpTextBoader">{CUSTOM_LABELS.Permission_Set_Name}</h2>
				   <p class="slds-p-top_xx-small">{CUSTOM_LABELS.Org_wide_help_text}</p>
				</div>
				<div class="slds-combobox_container slds-m-top_large">
				   <div class="slds-combobox slds-dropdown-trigger slds-dropdown-trigger_click slds-is-open" aria-expanded="true" aria-haspopup="listbox" role="combobox">
					  <div class="slds-combobox__form-element slds-input-has-icon slds-input-has-icon_right" role="none">
						 <div class="slds-form-element__control">
							<lightning-input
							   class="search-field_section"
							   type="search"
							   data-id="searchBox"
							   value={strSearchTerm}
							   label="Permission Set"
							   placeholder="Search..."
							   onchange={handlePSValues}
							   onclick={handleSearch}
							   variant="label-hidden"
							   >
							</lightning-input>
						 </div>
					  </div>
					  <div id="listbox-id-3"
						 class="slds-dropdown slds-dropdown_length-with-icon-7 slds-dropdown_fluid industry_list slds-hide search-field-section_dropdown"
						 role="listbox">
						 <ul class="slds-listbox slds-listbox_vertical" role="presentation">
							<template if:true={arrPSoptions}>
							   <template for:each={arrPSoptions} for:item="permissionset">
								  <li role="presentation" class="slds-listbox__item" key={permissionset.key}
									 onmousedown={handleSelect} data-id={permissionset.key}
									 data-name={permissionset.value}>
									 <div aria-selected="true" id={permissionset.key}
										class="slds-media slds-listbox__option slds-listbox__option_entity slds-listbox__option_has-meta"
										role="option" tabindex="0">
										<span class="slds-media__body">
										<span
										   class="slds-listbox__option-text slds-listbox__option-text_entity slds_optiontxt">{permissionset.value}</span>
										</span>
									 </div>
								  </li>
							   </template>
							</template>
							<template if:false={arrPSoptions}>
							   <div>Error</div>
							</template>
						 </ul>
					  </div>
				   </div>
				</div>
				<div if:true={bolShowPill} class="slds-p-top_small padge-section">
				   <lightning-pill-container class="padge-section custPills" items={arrSelectedPermissionSets}
					  onitemremove={handleSelectedPermissionRemove}>
				   </lightning-pill-container>
				</div>
			 </lightning-layout-item>
			 <lightning-layout-item  size="12" small-device-size="12" medium-device-size="6" large-device-size="6" padding="around-small">
				<div class="subtitle">
				   <h2 class="innerTitle">{CUSTOM_LABELS.File_Access}</h2>
				   <p class="slds-p-top_xx-small">{CUSTOM_LABELS.File_Access_Help_Text}</p>
				</div>
				<fieldset class="checkbox-group">
				   <legend class="checkbox-group-legend"></legend>
				   <div class="checkbox">
					  <label class="checkbox-wrapper">
						 <input type="checkbox" class="checkbox-input" data-name="upload" checked={bolUpload}
							onchange={handleAccessChange} value="upload" />
						 <span class="checkbox-tile">
							<span class="checkbox-icon">
							   <svg xmlns="http://www.w3.org/2000/svg" width="20" height="18" fill="none"
								  viewBox="0 0 18 14">
								  <g clip-path="url(#a)">
									 <path stroke="#4D4D4D" stroke-linecap="round" stroke-linejoin="round"
										d="M4.092 5.602C2.319 5.994 1 7.479 1 9.25 1 11.321 2.803 13 5.027 13c.381 0 .75-.05 1.1-.142m7.782-7.256C15.681 5.994 17 7.479 17 9.25c0 2.071-1.803 3.75-4.027 3.75-.381 0-.75-.05-1.1-.142M13.886 5.5c0-2.485-2.163-4.5-4.832-4.5S4.222 3.015 4.222 5.5m2.04 2.955 2.792-2.609L11.926 8.5m-2.872 3.75V7.173" />
								  </g>
							   </svg>
							</span>
							<span class="checkbox-label">{CUSTOM_LABELS.UPLOAD}</span>
						 </span>
					  </label>
				   </div>
				   <div class="checkbox">
					  <label class="checkbox-wrapper">
						 <input type="checkbox" class="checkbox-input" data-name="view" checked={bolView}
							onchange={handleAccessChange} value="view" />
						 <span class="checkbox-tile">
							<span class="checkbox-icon">
							   <svg class="svgDivforCheckBox" xmlns="http://www.w3.org/2000/svg" width="18"

							   </svg>
							</span>
							<span class="checkbox-label">{CUSTOM_LABELS.VIEW}</span>
						 </span>
					  </label>
				   </div>
				   <div class="checkbox">
					  <label class="checkbox-wrapper">
						 <input type="checkbox" class="checkbox-input" data-name="download" checked={bolDownload} onchange={handleAccessChange} value="download" />
						 <span class="checkbox-tile">
							<span class="checkbox-icon">
							   <svg class="svgdivforDownload" xmlns="http://www.w3.org/2000/svg" width="11"
								  height="11" fill="none" viewBox="0 0 11 11">

							   </svg>
							</span>
							<span class="checkbox-label">{CUSTOM_LABELS.Download}</span>
						 </span>
					  </label>
				   </div>
				   <div class="checkbox">
					  <label class="checkbox-wrapper">
						 <input type="checkbox" class="checkbox-input" data-name="preview" checked={bolPreview} onchange={handleAccessChange} value="preview" />
						 <span class="checkbox-tile">
							<span class="checkbox-icon">
							   <svg class="" xmlns="http://www.w3.org/2000/svg" width="13" height="13" fill="none"
								  viewBox="0 0 13 13">
								  <path fill="#4D4D4D"
									 d="m12.245 11.5-1.091-1.085a2.565 2.565 0 0 0-.503-3.383 2.59 2.59 0 0 0-1.114-.542l-.017-.003V4.384a.52.52 0 0 0-.121-.334v.001-.002a.488.488 0 0 0-.03-.034l-.005-.005-.014-.014L5.488.151a.469.469 0 0 0-.034-.03L5.441.11a.487.487 0 0 0-.026-.02L5.402.082 5.374.065 5.362.058a.314.314 0 0 0-.04-.019L5.307.033 5.28.023 5.26.018 5.231.01 5.216.007A.422.422 0 0 0 5.172 0H.527A.53.53 0 0 0 0 .523v10.531a.526.526 0 0 0 .527.527h8.466c.507 0 1.002-.148 1.423-.428l-.01.006 1.091 1.086a.53.53 0 0 0 .885-.377.525.525 0 0 0-.137-.367Zm-1.726-2.494a1.513 1.513 0 0 1-.447 1.076 1.529 1.529 0 0 1-1.665.33 1.529 1.529 0 0 1-.828-.823A1.515 1.515 0 0 1 7.91 7.93a1.531 1.531 0 0 1 2.161-.001c.287.285.448.673.448 1.076ZM5.642 1.793l2.072 2.064H5.642V1.793ZM1.058 1.05h3.526v3.335c0 .291.237.527.53.527h3.349v1.576a2.58 2.58 0 0 0-2.057 2.518c0 .574.188 1.103.506 1.53l-.005-.007h-5.85V1.05Z" />
							   </svg>
							</span>
							<span class="checkbox-label">{CUSTOM_LABELS.PREVIEW}</span>
						 </span>
					  </label>
				   </div>
				   <div class="checkbox">
					  <label class="checkbox-wrapper">
						 <input type="checkbox" class="checkbox-input" data-name="edit" checked={bolEdit} onchange={handleAccessChange} value="edit" />
						 <span class="checkbox-tile">
							<span class="checkbox-icon">
							   <svg class="svgdivforEDIT" xmlns="http://www.w3.org/2000/svg" width="13" height="15" fill="none" viewBox="0 0 13 15">
								  <path stroke="#4D4D4D" stroke-linecap="round" stroke-linejoin="round" stroke-width=".929" d="M11.57 7.606v-4.13a.396.396 0 0 0-.116-.28l-2.08-2.08A.396.396 0 0 0 9.094 1H1.396A.396.396 0 0 0 1 1.396v12.42a.397.397 0 0 0 .396.397h4.229M3.643 6.285h5.285M3.643 3.643h2.642M3.643 8.928h1.982m4.594 1.942.66-.66a.74.74 0 1 1 1.048 1.047l-.66.66-1.048-1.048-1.976 1.976a.66.66 0 0 0-.185.366l-.161 1.028 1.028-.16a.661.661 0 0 0 .365-.185l1.976-1.977"/>
								  <path stroke="#4D4D4D" stroke-linecap="round" stroke-linejoin="round" stroke-width=".929" d="M8.928 1v2.246a.396.396 0 0 0 .396.397h2.246"/>
							   </svg>
							</span>
							<span class="checkbox-label">{CUSTOM_LABELS.EDIT}</span>
						 </span>
					  </label>
				   </div>
				   <div class="checkbox">
					  <label class="checkbox-wrapper">
						 <input type="checkbox" class="checkbox-input" data-name="delete" checked={bolDelete} onchange={handleAccessChange} value="delete" />
						 <span class="checkbox-tile">
							<span class="checkbox-icon">
							   <svg class="svgdivforDelete" xmlns="http://www.w3.org/2000/svg" width="12" height="14" fill="none" viewBox="0 0 12 14">
								  <path fill="#4D4D4D" d="M1.304 13.62a1.23 1.23 0 0 1-.92-.4A1.344 1.344 0 0 1 0 12.26V1.362C0 .987.128.667.383.4.64.134.946 0 1.304 0h4.68a1.243 1.243 0 0 1 .912.392l3.163 3.303a1.385 1.385 0 0 1 .375.954v1.889a.675.675 0 0 1-.188.486.615.615 0 0 1-.464.195.622.622 0 0 1-.464-.196.672.672 0 0 1-.188-.485v-2.17H7.125c-.359 0-.292.028-.547-.239-.017-.305-.078-.254-.078-.629V1H1v11.5h4.348a.62.62 0 0 1 .465.199c.125.13.187.048.187.24a.681.681 0 0 1-.187.486.61.61 0 0 1-.465.196H1.304Zm7.826-1.753-.913.936a.625.625 0 0 1-.448.197.593.593 0 0 1-.465-.197.661.661 0 0 1-.18-.476.66.66 0 0 1 .18-.477l.913-.954-.913-.953a.661.661 0 0 1-.18-.477c0-.193.06-.351.18-.476a.605.605 0 0 1 .457-.188c.184 0 .336.063.456.188l.913.953.913-.953c.12-.125.27-.19.449-.196.18-.005.334.06.464.196.12.124.18.283.18.476s-.06.352-.18.477l-.897.954.897.953c.12.125.182.281.188.469a.644.644 0 0 1-.188.484.604.604 0 0 1-.457.188.605.605 0 0 1-.456-.188l-.913-.936Z"/>

						 </span>

				   </div>
				</fieldset>
			 </lightning-layout-item>
		  </lightning-layout>
		  <div class="ftrBtncont slds-text-align_right"><input type="submit" onclick={savePermissions} class="primarybtn color-1" value={CUSTOM_LABELS.Save} disabled={bolDisableSave} /></div>
	   </div>
	   <div if:false={bolShowPermissionForm}>
		  <div class="slds-text-align_right">
			 <div if:true={bolSpinner}>
				<lightning-spinner variant="brand" alternative-text="Loading..." size="medium"> </lightning-spinner>
			 </div>
		  </div>
		  <div class="slds-scrollable tableBoaderdiv">
			 <div class="resptbl">
				<table class="tableHeaderDiv" if:false={bolHideConfigTable}>
				   <thead>
					  <tr class="slds-line-height_reset slds-text-align_center tableheaderTR">
						 <th scope="col"  class="txtCenter th-center th-Width">
						 </th>
						 <th scope="col" class="th-permission">{CUSTOM_LABELS.Permission_Set_Name}</th>
						 <th scope="col">{CUSTOM_LABELS.UPLOAD}</th>
						 <th scope="col">{CUSTOM_LABELS.VIEW}</th>
						 <th scope="col">{CUSTOM_LABELS.PREVIEW}</th>
						 <th scope="col">{CUSTOM_LABELS.Download}</th>
						 <th scope="col">{CUSTOM_LABELS.EDIT}</th>
						 <th scope="col">{CUSTOM_LABELS.Delete}</th>
						 <th scope="col">{CUSTOM_LABELS.ACTION}</th>
					  </tr>
				   </thead>
				   <tbody>
					  <template iterator:it={arrPermissionConfigurations}>
						 <tr class="slds-hint-parent" key={it.value.idConfiguration}
							data-rowid={it.value.idConfiguration} data-id={it.value.idConfiguration}
							ondblclick={handleEdit}>
							<td data-label="Select" class="txtCenter">
							   <lightning-input type="checkbox" checked={it.value.bolSelect}
								  onchange={handleSelection} data-id={it.value.idConfiguration}
								  data-type="permission" class="ml12"> </lightning-input>
							</td>
							<td class="td-strPsname" data-label="PermissionSet">
							   <p>{it.value.strPSname}</p>
							</td>
							<td data-label="Upload" class="td-rowtext-align">
							   <lightning-input type="checkbox" onchange={handlePermissionChange}
								  checked={it.value.bolUpload} disabled={it.value.bolEditable}
								  data-id={it.value.idConfiguration} data-name="upload"
								  class="ml12"></lightning-input>
							</td>
							<td data-label="View" class="td-rowtext-align">
							   <lightning-input type="checkbox" onchange={handlePermissionChange}
								  checked={it.value.bolView} disabled={it.value.bolEditable}
								  data-id={it.value.idConfiguration} data-name="view"
								  class="ml12"></lightning-input>
							</td>
							<td data-label="Preview" class="td-rowtext-align">
							   <lightning-input type="checkbox" onchange={handlePermissionChange}
								  checked={it.value.bolPreview} disabled={it.value.bolEditable}
								  data-id={it.value.idConfiguration} data-name="preview"
								  class="ml12"></lightning-input>
							</td>
							<td data-label="Download" class="td-rowtext-align">
							   <lightning-input type="checkbox" onchange={handlePermissionChange}
								  checked={it.value.bolDownload} disabled={it.value.bolEditable}
								  data-id={it.value.idConfiguration} data-name="download"
								  class="ml12"></lightning-input>
							</td>
							<td data-label="Edit" class="td-rowtext-align">
							   <lightning-input type="checkbox" onchange={handlePermissionChange}
								  checked={it.value.bolEdit} disabled={it.value.bolEditable}
								  data-id={it.value.idConfiguration} data-name="edit"
								  class="ml12"></lightning-input>
							</td>
							<td data-label="Delete" class="td-rowtext-align">
							   <lightning-input type="checkbox" onchange={handlePermissionChange}
								  checked={it.value.bolDelete} disabled={it.value.bolEditable}
								  data-id={it.value.idConfiguration} data-name="delete"
								  class="ml12"></lightning-input>
							</td>
							<td data-label="Action" class="tabledataaction-style">
							   <button class="slds-button slds-button_icon btnedit t" title="Edit"
								  onclick={handleEdit} data-id={it.value.idConfiguration}>
								  <svg xmlns="http://www.w3.org/2000/svg" width="18" height="22"
									 viewBox="0 0 36 36">
									 <path data-id="edit" data-name="edit"
										d="M4477.327,34.416a1.637,1.637,0,0,1-.281-1.38l2.24-9.524,16.208-16.33,8.844,8.741L4488.446,32.5l-9.715,2.324s-.061.006-.16.006A1.825,1.825,0,0,1,4477.327,34.416Zm19.856-29.087,3.535-3.536a2,2,0,0,1,2.828,0l6.652,6.652a2,2,0,0,1,0,2.828l-3.534,3.534Z"
										transform="translate(-4477 -1.208)" />
								  </svg>
							   </button>
							   <button class="slds-button slds-button_icon btndelete" title="Delete"
								  onclick={handleConfirmDelete} data-id={it.value.idConfiguration}>
								  <svg xmlns="http://www.w3.org/2000/svg" width="18" height="22"
