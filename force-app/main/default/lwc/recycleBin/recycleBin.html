<!--
   * Purpose : To display recycle bin of filetranz and to restore that data. 
   * Author  : Nishanth
   -->
   <template>
	<lightning-card>
	   <div class="recyclebin-style slds-p-horizontal_small slds-p-bottom_medium">
		  <div>
			 <h2 class="slds-card__header-title header-style">
				<svg class="delete-icon delete-style" xmlns="http://www.w3.org/2000/svg" width="18" height="22" viewBox="0 0 160 160">
				   <path fill="#Fff" id="rwdelete-128" data-name="rwdelete" d="M4514,164a16,16,0,0,1-16-16V70a6.006,6.006,0,0,1,6-6h96a6.006,6.006,0,0,1,6,6v78a16,16,0,0,1-16,16Zm48-19h13V89h-13Zm-34,0h13V89h-13Zm37-95h-83a5,5,0,0,1-5-5V32a5,5,0,0,1,5-5h42V19a16,16,0,0,1,16-16h25a16,16,0,0,1,16,16v8h41a5,5,0,0,1,5,5V45a5,5,0,0,1-5,5Zm2-23V19.42a4,4,0,0,0-4-4h-21a4,4,0,0,0-4,4V27Z" transform="translate(-4477 -2.999)"></path>
				</svg>
				<span class="slds-text-heading_small slds-truncate slds-p-left_small">{strRecycleTitle}</span>
			 </h2>
		  </div>
		  <div class="search-style search-field_section">
			 <lightning-input  class="searchinput-style" type="Search" variant="label-hidden"
				placeholder={strSearch} onchange={handleSearch}></lightning-input>
			 <button class="restorebtn" disabled={bolDisableRestore} title={CUSTOM_LABELS.Restore}
				onclick={handleRestoreExternalFiles} data-restoretype="GlobalRestore">
				<svg xmlns="http://www.w3.org/2000/svg" width="14" height="29.739" viewBox="0 0 150 161">
				   <path id="restore" data-name="restore"
					  d="M4514,161a16,16,0,0,1-16-16V67a6.006,6.006,0,0,1,6-6h96a6.006,6.006,0,0,1,6,6v78a16,16,0,0,1-16,16Zm38-18h.007a32.008,32.008,0,1,0-22.633-54.627c-.044.045-.089.091-.136.136l-.016.017-5.45-5.45a1.975,1.975,0,0,0-1.4-.589,2,2,0,0,0-2.005,1.85l-1.608,20.915a1.976,1.976,0,0,0,.524,1.511,2,2,0,0,0,1.465.642c.052,0,.106,0,.158-.006l20.914-1.609a2,2,0,0,0,1.261-3.408L4537,96.3c.024-.026.05-.05.076-.075l.074-.077A21.006,21.006,0,1,1,4552,132H4552Zm13-96h-83a5,5,0,0,1-5-5V29a5,5,0,0,1,5-5h42V16a16,16,0,0,1,16-16h25a16,16,0,0,1,16,16v8h41a5,5,0,0,1,5,5V42a5,5,0,0,1-5,5Zm2-23V16.421a4,4,0,0,0-4-4h-21a4,4,0,0,0-4,4V24Z"
					  transform="translate(-4477)" />
				</svg>
			 </button>
		  </div>
	   </div>
	   <div if:true={bolDeletedFiles} class="empty-state">
		  <svg class="empty-state-icon" xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 160 160">
			 <path fill="#A6ADBB" d="M4514,164a16,16,0,0,1-16-16V70a6.006,6.006,0,0,1,6-6h96a6.006,6.006,0,0,1,6,6v78a16,16,0,0,1-16,16Zm48-19h13V89h-13Zm-34,0h13V89h-13Zm37-95h-83a5,5,0,0,1-5-5V32a5,5,0,0,1,5-5h42V19a16,16,0,0,1,16-16h25a16,16,0,0,1,16,16v8h41a5,5,0,0,1,5,5V45a5,5,0,0,1-5,5Zm2-23V19.42a4,4,0,0,0-4-4h-21a4,4,0,0,0-4,4V27Z" transform="translate(-4477 -2.999)"></path>
		  </svg>
		  <p class="empty-state-text"><b>{CUSTOM_LABELS.RecyleBin_External_No_Delete_Msg}</b></p>
	   </div>
	   <div class="slds-m-left_x-small slds-m-right_x-small slds-scrollable table-style">
		  <table if:false={bolDeletedFiles}>
			 <thead class="tablehead-style">
				<tr class="slds-line-height_reset">
				   <th class="colhead-style" scope="col">
					  <div class="slds-truncate">
						 <lightning-input onchange={handleSelectAll} checked={bolAllChecked} type="checkbox"
							class="select-style ml12"></lightning-input>
					  </div>
				   </th>
				   <th class="filename-style" scope="col" >
					  <div class="slds-truncate" title={CUSTOM_LABELS.File_Name}>{CUSTOM_LABELS.File_Name}</div>
				   </th>
				   <th class="filetype-style" scope="col" >
					  <div class="slds-truncate" title={CUSTOM_LABELS.File_Type}>{CUSTOM_LABELS.File_Type}</div>
				   </th>
				   <th class="objectname-style" scope="col" >
					  <div class="slds-truncate" title={CUSTOM_LABELS.Object_Name}>{CUSTOM_LABELS.Object_Name}</div>
				   </th>
				   <th class="parentrecord-style" scope="col" >
					  <div class="slds-truncate" title={CUSTOM_LABELS.Parent_Record_Of_File}>{CUSTOM_LABELS.Parent_Record_Of_File}</div>
				   </th>
				   <th class="action-style" scope="col" >
					  <div class="slds-truncate" title={CUSTOM_LABELS.ACTION}>{CUSTOM_LABELS.ACTION}</div>
				   </th>
				</tr>
			 </thead>
			 <tbody>
				<template for:each={arrExtFileData} for:item="recfiles" for:index="index">
				   <tr key={recfiles.Id}>
					  <td data-label="" class="">
						 <lightning-input checked={recfiles.bolSelectCheckbox} type="checkbox"
							data-id={recfiles.Id} onchange={handleSelect} class="ml12"></lightning-input>
					  </td>
					  <td data-label="File Name" class="recfilename-style" title={recfiles.File_Name__c}>{recfiles.File_Name__c}</td>
					  <td data-label="File Type" class = "recfiletype-style" title={recfiles.File_Name__c}>{recfiles.File_Type__c}</td>
					  <td data-label="Object Name" class="object-style">{recfiles.Object_Type__c}</td>
					  <td data-label="Parent Record of File"  class="recordfile-style"><a href="#" data-strid={recfiles.Related_To__c}
						 onclick={handleRelatedRowAction}>{recfiles.Related_To__c}</a></td>
					  <td data-label="Action" class="recordfile-style">
						 <div class="">
							<button class="slds-button slds-button_icon btnrestore" title={CUSTOM_LABELS.Restore} onclick={handleRestoreExternalFiles} data-restoretype="RowRestore" data-id={recfiles.Id} data-index={index}>
							   <svg xmlns="http://www.w3.org/2000/svg" width="24" height="29.739"
								  viewBox="0 0 150 161">
								  <path data-name="Union 82"
									 d="M4514,161a16,16,0,0,1-16-16V67a6.006,6.006,0,0,1,6-6h96a6.006,6.006,0,0,1,6,6v78a16,16,0,0,1-16,16Zm38-18h.007a32.008,32.008,0,1,0-22.633-54.627c-.044.045-.089.091-.136.136l-.016.017-5.45-5.45a1.975,1.975,0,0,0-1.4-.589,2,2,0,0,0-2.005,1.85l-1.608,20.915a1.976,1.976,0,0,0,.524,1.511,2,2,0,0,0,1.465.642c.052,0,.106,0,.158-.006l20.914-1.609a2,2,0,0,0,1.261-3.408L4537,96.3c.024-.026.05-.05.076-.075l.074-.077A21.006,21.006,0,1,1,4552,132H4552Zm13-96h-83a5,5,0,0,1-5-5V29a5,5,0,0,1,5-5h42V16a16,16,0,0,1,16-16h25a16,16,0,0,1,16,16v8h41a5,5,0,0,1,5,5V42a5,5,0,0,1-5,5Zm2-23V16.421a4,4,0,0,0-4-4h-21a4,4,0,0,0-4,4V24Z"
									 transform="translate(-4477)" />
							   </svg>
							</button>
						 </div>
					  </td>
				   </tr>
				</template>
			 </tbody>
		  </table>
	   </div>
	</lightning-card>
 </template>
